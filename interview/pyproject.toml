[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-utils"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "pandas>=2.0,<3.0",
  "numpy>=1.24,<3.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "hypothesis[pandas]>=6"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --maxfail=1"
