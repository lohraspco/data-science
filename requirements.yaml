# Data Science Environment Requirements (YAML Format)
# Compatible with conda, pip-tools, and other package managers

name: finetune
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
# Pip-specific packages (for packages not available in conda)
  - pip
  - pip:
    # # Step 1: Install PyTorch packages from custom URL (CUDA 12.6)
    - torch==2.3.0+cu126 --find-links https://download.pytorch.org/whl/cu126
    - torchvision==0.18.0+cu126 --find-links https://download.pytorch.org/whl/cu126
    - torchaudio==2.3.0+cu126 --find-links https://download.pytorch.org/whl/cu126   
    - pytorch-forecasting==1.4.0
    # # Step 2: Install TensorFlow (without auto-upgrading anything)
